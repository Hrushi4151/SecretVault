name: SecretVault CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: secretvault_test
          POSTGRES_USER: vault_test_user
          POSTGRES_PASSWORD: vault_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile Backend
        run: mvn -f backend/pom.xml clean compile

      - name: Run Automated Tests
        run: mvn -f backend/pom.xml test
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: secretvault_test
          DB_USER: vault_test_user
          DB_PASSWORD: vault_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          VAULT_MASTER_KEY: dGVzdF9tYXN0ZXJfa2V5XzMyX2J5dGVzX2Zvcl9sb2NhbF9kZXY=
          JWT_SECRET: super_secret_jwt_signing_key_for_local_development_only_minimum_256_bits_length

      - name: Package Artifact
        run: mvn -f backend/pom.xml package -DskipTests
