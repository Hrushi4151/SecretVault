name: SecretVault CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: secretvault_test
          POSTGRES_USER: vault_test_user
          POSTGRES_PASSWORD: vault_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile Backend
        run: mvn -f backend/pom.xml clean compile

      - name: Run Automated Tests
        run: mvn -f backend/pom.xml test
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: secretvault_test
          DB_USER: vault_test_user
          DB_PASSWORD: vault_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          VAULT_MASTER_KEY: dGVzdF9tYXN0ZXJfa2V5XzMyX2J5dGVzX2Zvcl9sb2NhbF9kZXY=
          JWT_SECRET: super_secret_jwt_signing_key_for_local_development_only_minimum_256_bits_length

      - name: Package Artifact
        run: mvn -f backend/pom.xml package -DskipTests

  cli-build-test:
    name: CLI Build & Test (Java 21 & Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'cli/package-lock.json'

      - name: Run CLI Unit & Security Tests
        run: mvn -f cli/pom.xml clean test

      - name: Build Shaded Executable JAR & Distribution
        run: |
          npm --prefix cli run build:java
          npm --prefix cli run prepack

      - name: Run npm Launcher Tests
        run: npm --prefix cli test

      - name: Verify CLI Dry-Run Packaging
        working-directory: cli
        run: npm pack --dry-run

  sdk-build-test:
    name: Java SDK Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run SDK Tests
        run: mvn -f sdk/pom.xml clean test

  frontend-build-test:
    name: Frontend Test & Build (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Tests
        run: npm --prefix frontend test -- --maxConcurrency=2

      - name: Build Frontend Production Bundle
        run: npm --prefix frontend run build

  kubernetes-validation:
    name: Kubernetes CRDs, Operator & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: helm lint infrastructure/kubernetes/helm/secretvault-operator

      - name: Run Kubernetes Test Suites
        run: |
          node infrastructure/kubernetes/test/crd_validation_test.js
          node infrastructure/kubernetes/test/auth_contract_test.js
          node infrastructure/kubernetes/test/operator_reconciler_test.js
          node infrastructure/kubernetes/test/secret_sync_test.js
          node infrastructure/kubernetes/test/helm_validation_test.js
