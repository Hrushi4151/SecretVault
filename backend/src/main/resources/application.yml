server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: secretvault-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:secretvault}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 20000
      max-lifetime: 300000
      keepalive-time: 30000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Application Security Configuration
secretvault:
  incident:
    worker:
      enabled: ${INCIDENT_WORKER_ENABLED:true}
      poll-interval-ms: ${INCIDENT_WORKER_POLL_INTERVAL_MS:2000}
      stale-threshold-minutes: ${INCIDENT_WORKER_STALE_THRESHOLD_MINUTES:5}
  security:
    master-key: ${VAULT_MASTER_KEY:}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  redis:
    environment: ${REDIS_ENV:${SPRING_PROFILES_ACTIVE:local}}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    cache:
      enabled: true
    ttl:
      default-rate-limit: 60s
      mfa-challenge: 300s
      step-up: 600s
      metadata-cache: 300s
      idempotency: 120s
  mfa:
    totp:
      algorithm: SHA1
      digits: 6
      period-seconds: 30
      allowed-drift-steps: 1
      issuer: SecretVault
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:SecretVault}
    allowed-origins:
      - ${WEBAUTHN_ORIGIN_DEV_1:http://localhost:5173}
      - ${WEBAUTHN_ORIGIN_DEV_2:http://localhost:3000}
      - ${WEBAUTHN_ORIGIN_DEV_3:http://localhost:8080}
      - ${WEBAUTHN_ORIGIN_PROD:https://app.secretvault.dev}
    challenge-ttl-seconds: 300
    timeout-seconds: 60
    user-verification: PREFERRED
    allow-origin-port: true
  sync:
    scheduler:
      enabled: ${SYNC_SCHEDULER_ENABLED:true}
      interval-ms: ${SYNC_SCHEDULER_INTERVAL_MS:300000}
      batch-size: ${SYNC_SCHEDULER_BATCH_SIZE:50}
    lock:
      allow-local-fallback: ${SYNC_LOCK_ALLOW_LOCAL_FALLBACK:false}
      lease-duration-ms: ${SYNC_LOCK_LEASE_DURATION_MS:60000}
      renewal-interval-ms: ${SYNC_LOCK_RENEWAL_INTERVAL_MS:10000}
  pingram:
    api-key: ${PINGRAM_API_KEY:pingram_sk_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJrZXlfM2M3YTdiNjFkODZjZTEwYzNiZWYwZmE4NGJlYjU0ZWIiLCJ2ZXJzaW9uIjoxLCJhY2NvdW50SWQiOiJsZ3VlcmEwb2I5dzYzYmNodzVleTBkN3l3dSIsImtleVR5cGUiOiJzZWNyZXQiLCJlbnZpcm9ubWVudElkIjoibGd1ZXJhMG9iOXc2M2JjaHc1ZXkwZDd5d3UifQ.82RRX5wbb0-UvImvx7Yyv1YCB3FAl5IzZpVrDKYLyQQ}
    base-url: ${PINGRAM_BASE_URL:https://api.pingram.io}
    from-name: ${PINGRAM_FROM_NAME:SecretVault Security}
    from-address: ${PINGRAM_FROM_ADDRESS:noreply@pingram.io}
  ai:
    provider: ${AI_PROVIDER:GEMINI}
    fallback-provider: ${AI_FALLBACK_PROVIDER:NONE}
    ollama:
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${AI_OLLAMA_MODEL:qwen3:8b}
      timeout-seconds: ${AI_OLLAMA_TIMEOUT_SECONDS:120}
      temperature: 0.2
      max-tokens: 2048
    gemini:
      base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${AI_GEMINI_MODEL:gemini-3.5-flash-lite}
      api-key: ${AI_GEMINI_API_KEY:${GEMINI_API_KEY:}}
      timeout-seconds: ${AI_GEMINI_TIMEOUT_SECONDS:60}
      temperature: 0.1
      max-tokens: 2048
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_API_KEY:}
