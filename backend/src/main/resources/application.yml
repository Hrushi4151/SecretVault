server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: secretvault-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:secretvault}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Application Security Configuration
secretvault:
  security:
    master-key: ${VAULT_MASTER_KEY:}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  redis:
    environment: ${REDIS_ENV:${SPRING_PROFILES_ACTIVE:local}}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    cache:
      enabled: true
    ttl:
      default-rate-limit: 60s
      mfa-challenge: 300s
      step-up: 600s
      metadata-cache: 300s
      idempotency: 120s
  mfa:
    totp:
      algorithm: SHA1
      digits: 6
      period-seconds: 30
      allowed-drift-steps: 1
      issuer: SecretVault
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:SecretVault}
    allowed-origins:
      - ${WEBAUTHN_ORIGIN_DEV_1:http://localhost:5173}
      - ${WEBAUTHN_ORIGIN_DEV_2:http://localhost:3000}
      - ${WEBAUTHN_ORIGIN_DEV_3:http://localhost:8080}
      - ${WEBAUTHN_ORIGIN_PROD:https://app.secretvault.dev}
    challenge-ttl-seconds: 300
    timeout-seconds: 60
    user-verification: PREFERRED
    allow-origin-port: true
    clone-detection-action: BLOCK
