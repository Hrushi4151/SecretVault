# Local Development Docker Compose (Database & Redis only for running backend from IDE)
services:
  postgres:
    image: postgres:16-alpine
    container_name: secretvault-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: secretvault_dev
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_secure_password_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: secretvault-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
