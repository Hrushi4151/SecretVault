apiVersion: secretvault.io/v1alpha1
kind: SecretVaultSync
metadata:
  name: backend-filtered-sync
  namespace: order-processing
spec:
  workspace: default
  project: order-management
  environment: staging
  refreshInterval: 10m
  driftPolicy: Enforce
  auth:
    serviceAccountRef:
      name: order-processor-sa
  target:
    secretName: order-secrets
    creationPolicy: Owner
  filter:
    includeKeys:
      - DATABASE_URL
      - REDIS_PASSWORD
      - KAFKA_AUTH_TOKEN
    tags:
      - backend
      - staging
  rotationPolicy:
    onRotation: RestartWorkload
    workloadSelector:
      matchLabels:
        app: order-processor
