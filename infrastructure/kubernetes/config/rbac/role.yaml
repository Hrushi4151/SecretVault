apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secretvault-operator-manager-role
  labels:
    app.kubernetes.io/name: secretvault-operator
    app.kubernetes.io/part-of: secretvault
rules:
  # SecretVault CRDs permissions
  - apiGroups:
      - secretvault.io
    resources:
      - secretvaultsecrets
      - secretvaultsyncs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Status subresource permissions
  - apiGroups:
      - secretvault.io
    resources:
      - secretvaultsecrets/status
      - secretvaultsyncs/status
    verbs:
      - get
      - patch
      - update
  # Kubernetes core Secret synchronization permissions (Phase 13.4)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Workload rolling restart permissions on secret rotation (apps/v1)
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  # Event emission permissions
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Leader election coordination lock
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
