apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secretvault-operator-manager-role
  labels:
    app.kubernetes.io/name: secretvault-operator
    app.kubernetes.io/part-of: secretvault
rules:
  # SecretVault CRDs permissions
  - apiGroups:
      - secretvault.io
    resources:
      - secretvaultsecrets
      - secretvaultsyncs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Status subresource permissions
  - apiGroups:
      - secretvault.io
    resources:
      - secretvaultsecrets/status
      - secretvaultsyncs/status
    verbs:
      - get
      - patch
      - update
  # Event emission permissions
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
