apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secretvault-operator-leader-election-rolebinding
  namespace: secretvault-system
  labels:
    app.kubernetes.io/name: secretvault-operator
    app.kubernetes.io/part-of: secretvault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secretvault-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: secretvault-operator-controller-manager
    namespace: secretvault-system
