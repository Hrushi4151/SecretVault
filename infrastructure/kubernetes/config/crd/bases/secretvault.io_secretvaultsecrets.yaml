---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: secretvaultsecrets.secretvault.io
spec:
  group: secretvault.io
  names:
    kind: SecretVaultSecret
    listKind: SecretVaultSecretList
    plural: secretvaultsecrets
    singular: secretvaultsecret
    shortNames:
      - svs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: WORKSPACE
          type: string
          description: Target Workspace
          jsonPath: .spec.workspace
        - name: PROJECT
          type: string
          description: Target Project
          jsonPath: .spec.project
        - name: ENV
          type: string
          description: Target Environment
          jsonPath: .spec.environment
        - name: SECRET
          type: string
          description: Secret Key Name
          jsonPath: .spec.secretName
        - name: VERSION
          type: integer
          description: Synchronized Version
          jsonPath: .status.currentVersion
        - name: SYNCED
          type: string
          description: Sync Status
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: SecretVaultSecret defines a desired reference to a single secret managed in SecretVault.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object.'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents.'
              type: string
            metadata:
              type: object
            spec:
              description: SecretVaultSecretSpec defines the desired state of a single secret reference from SecretVault.
              type: object
              required:
                - workspace
                - project
                - environment
                - secretName
              properties:
                serverUrl:
                  description: ServerUrl is the base URL of the SecretVault API server.
                  type: string
                  default: "http://secretvault-backend.secretvault.svc.cluster.local:8080"
                  pattern: '^https?://.*'
                workspace:
                  description: Workspace is the slug or UUID of the target SecretVault workspace.
                  type: string
                  minLength: 1
                  maxLength: 64
                project:
                  description: Project is the slug or UUID of the target SecretVault project.
                  type: string
                  minLength: 1
                  maxLength: 64
                environment:
                  description: Environment is the slug or tier of the target SecretVault environment.
                  type: string
                  minLength: 1
                  maxLength: 64
                secretName:
                  description: SecretName is the key name of the secret in SecretVault (e.g. DB_PASSWORD).
                  type: string
                  minLength: 1
                  maxLength: 255
                version:
                  description: Version is an optional pinned historical version number to synchronize.
                  type: integer
                  minimum: 1
                versionPolicy:
                  description: VersionPolicy specifies whether to track the latest active version or a pinned version.
                  type: string
                  enum:
                    - LATEST
                    - PINNED
                  default: LATEST
                auth:
                  description: Auth specifies authentication parameters for OIDC workload identity exchange.
                  type: object
                  properties:
                    serviceAccountRef:
                      description: ServiceAccountRef references a local ServiceAccount for projected token OIDC exchange.
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          description: Name of the Kubernetes ServiceAccount.
                          type: string
                          minLength: 1
                          maxLength: 253
                        audiences:
                          description: Audiences requested in the projected token.
                          type: array
                          items:
                            type: string
                          default:
                            - "https://api.secretvault.io"
                    machineIdentity:
                      description: MachineIdentity name or UUID registered in SecretVault workspace.
                      type: string
                    providerId:
                      description: ProviderId of the OIDC provider configured in SecretVault workspace.
                      type: string
                target:
                  description: Target defines destination Kubernetes Secret details.
                  type: object
                  properties:
                    name:
                      description: Name of the target Kubernetes Secret. Defaults to the resource name.
                      type: string
                      maxLength: 253
                    key:
                      description: Key is the key name inside the Kubernetes Secret data map. Defaults to secretName.
                      type: string
                      maxLength: 253
                    creationPolicy:
                      description: CreationPolicy determines whether the operator sets owner references on the target Secret.
                      type: string
                      enum:
                        - Owner
                        - Merge
                        - None
                      default: Owner
                refreshInterval:
                  description: RefreshInterval defines how frequently the operator re-evaluates the secret version.
                  type: string
                  default: "1h"
                  pattern: '^[0-9]+(s|m|h)$'
                lease:
                  description: Lease defines optional ephemeral lease configuration.
                  type: object
                  properties:
                    enableLease:
                      description: EnableLease determines whether an ephemeral SecretVault lease is registered for this secret.
                      type: boolean
                      default: false
                    ttl:
                      description: TTL defines the desired lease duration.
                      type: string
                      default: "3600s"
                      pattern: '^[0-9]+(s|m|h)$'
                    autoRenew:
                      description: AutoRenew indicates whether the operator should periodically renew the lease.
                      type: boolean
                      default: true
                    consumerType:
                      description: ConsumerType categorizes the consuming workload in the SecretVault registry.
                      type: string
                      enum:
                        - CONTAINER
                        - SERVICE
                        - WORKER
                        - JOB
                      default: CONTAINER
            status:
              description: SecretVaultSecretStatus defines the observed state of SecretVaultSecret. NOTE Plaintext secret values are NEVER exposed in status.
              type: object
              properties:
                conditions:
                  description: Conditions represent the latest available observations of the resource state.
                  type: array
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from one status to another.
                        type: string
                        format: date-time
                      message:
                        description: message is a human readable message indicating details about the transition.
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the condition was set based upon.
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                observedGeneration:
                  description: ObservedGeneration is the most recent generation observed by the controller.
                  type: integer
                  format: int64
                lastSyncTime:
                  description: LastSyncTime is the timestamp of the last successful synchronization.
                  type: string
                  format: date-time
                currentVersion:
                  description: CurrentVersion is the active SecretVault secret version currently synchronized.
                  type: integer
                secretFingerprint:
                  description: SecretFingerprint is the non-sensitive SHA-256 fingerprint hash of the synchronized version.
                  type: string
                leaseId:
                  description: LeaseId is the active SecretVault lease UUID if leases are enabled.
                  type: string
                leaseExpiresAt:
                  description: LeaseExpiresAt is the expiration timestamp of the active lease.
                  type: string
                  format: date-time
                targetSecretRef:
                  description: TargetSecretRef references the generated Kubernetes Secret.
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      type: string
                    resourceVersion:
                      type: string
