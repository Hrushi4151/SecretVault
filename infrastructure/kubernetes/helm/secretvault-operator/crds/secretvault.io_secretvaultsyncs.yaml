---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: secretvaultsyncs.secretvault.io
spec:
  group: secretvault.io
  names:
    kind: SecretVaultSync
    listKind: SecretVaultSyncList
    plural: secretvaultsyncs
    singular: secretvaultsync
    shortNames:
      - svsync
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: WORKSPACE
          type: string
          description: Target Workspace
          jsonPath: .spec.workspace
        - name: PROJECT
          type: string
          description: Target Project
          jsonPath: .spec.project
        - name: ENV
          type: string
          description: Target Environment
          jsonPath: .spec.environment
        - name: TARGET
          type: string
          description: Target K8s Secret
          jsonPath: .spec.target.secretName
        - name: SECRETS
          type: integer
          description: Number of Synced Secrets
          jsonPath: .status.syncedSecretCount
        - name: SYNCED
          type: string
          description: Sync Status
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: DRIFT
          type: boolean
          description: Drift State
          jsonPath: .status.driftDetected
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: SecretVaultSync defines a bulk environment secret synchronization policy into a Kubernetes namespace.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object.'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents.'
              type: string
            metadata:
              type: object
            spec:
              description: SecretVaultSyncSpec defines the desired state of bulk secret synchronization from SecretVault.
              type: object
              required:
                - workspace
                - project
                - environment
                - target
              properties:
                serverUrl:
                  description: ServerUrl is the base URL of the SecretVault API server.
                  type: string
                  default: "http://secretvault-backend.secretvault.svc.cluster.local:8080"
                  pattern: '^https?://.*'
                workspace:
                  description: Workspace is the slug or UUID of the target SecretVault workspace.
                  type: string
                  minLength: 1
                  maxLength: 64
                project:
                  description: Project is the slug or UUID of the target SecretVault project.
                  type: string
                  minLength: 1
                  maxLength: 64
                environment:
                  description: Environment is the slug or tier of the target SecretVault environment.
                  type: string
                  minLength: 1
                  maxLength: 64
                auth:
                  description: Auth specifies authentication parameters for OIDC workload identity exchange.
                  type: object
                  properties:
                    serviceAccountRef:
                      description: ServiceAccountRef references a local ServiceAccount for projected token OIDC exchange.
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          description: Name of the Kubernetes ServiceAccount.
                          type: string
                          minLength: 1
                          maxLength: 253
                        audiences:
                          description: Audiences requested in the projected token.
                          type: array
                          items:
                            type: string
                          default:
                            - "https://api.secretvault.io"
                    machineIdentity:
                      description: MachineIdentity name or UUID registered in SecretVault workspace.
                      type: string
                    providerId:
                      description: ProviderId of the OIDC provider configured in SecretVault workspace.
                      type: string
                target:
                  description: Target defines destination Kubernetes Secret details.
                  type: object
                  required:
                    - secretName
                  properties:
                    secretName:
                      description: SecretName is the name of the destination Kubernetes Secret.
                      type: string
                      minLength: 1
                      maxLength: 253
                    creationPolicy:
                      description: CreationPolicy determines whether the operator sets owner references on the target Secret.
                      type: string
                      enum:
                        - Owner
                        - Merge
                        - None
                      default: Owner
                    template:
                      description: Template allows customization of the generated Secret metadata and type.
                      type: object
                      properties:
                        type:
                          description: Type of the Kubernetes Secret (e.g. Opaque, kubernetes.io/tls).
                          type: string
                          default: Opaque
                        metadata:
                          description: Metadata to attach to the generated Kubernetes Secret.
                          type: object
                          properties:
                            annotations:
                              type: object
                              additionalProperties:
                                type: string
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                filter:
                  description: Filter defines whitelists, blacklists, or tag filters for secrets in the environment.
                  type: object
                  properties:
                    includeKeys:
                      description: Whitelist of SecretVault secret names to synchronize.
                      type: array
                      items:
                        type: string
                    excludeKeys:
                      description: Blacklist of SecretVault secret names to exclude.
                      type: array
                      items:
                        type: string
                    tags:
                      description: List of metadata tags; only secrets matching all specified tags will be synced.
                      type: array
                      items:
                        type: string
                refreshInterval:
                  description: RefreshInterval defines how frequently the operator re-evaluates all secrets in the scope.
                  type: string
                  default: "15m"
                  pattern: '^[0-9]+(s|m|h)$'
                rotationPolicy:
                  description: RotationPolicy defines automated workload actions on upstream rotation.
                  type: object
                  properties:
                    onRotation:
                      description: OnRotation specifies the action to perform upon detecting a secret rotation.
                      type: string
                      enum:
                        - RestartWorkload
                        - NotifyOnly
                        - SyncOnly
                      default: SyncOnly
                    workloadSelector:
                      description: WorkloadSelector selects Deployments, StatefulSets, or DaemonSets to trigger rolling restarts.
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - operator
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                                enum:
                                  - In
                                  - NotIn
                                  - Exists
                                  - DoesNotExist
                              values:
                                type: array
                                items:
                                  type: string
                driftPolicy:
                  description: DriftPolicy defines how the operator reconciles modifications to the target Kubernetes Secret.
                  type: string
                  enum:
                    - Enforce
                    - DetectOnly
                    - Ignore
                  default: Enforce
            status:
              description: SecretVaultSyncStatus defines the observed state of bulk SecretVaultSync. NOTE Plaintext secret values are NEVER exposed in status.
              type: object
              properties:
                conditions:
                  description: Conditions represent the latest available observations of the sync state.
                  type: array
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                observedGeneration:
                  description: ObservedGeneration is the most recent generation observed by the controller.
                  type: integer
                  format: int64
                lastSyncTime:
                  description: LastSyncTime is the timestamp of the last successful bulk synchronization.
                  type: string
                  format: date-time
                syncedSecretCount:
                  description: SyncedSecretCount is the number of individual secrets currently synchronized.
                  type: integer
                driftDetected:
                  description: DriftDetected indicates whether external modification to the target Secret was detected.
                  type: boolean
                driftSummary:
                  description: DriftSummary provides non-sensitive diagnostic details regarding detected drift.
                  type: string
                targetSecretRef:
                  description: TargetSecretRef references the generated Kubernetes Secret.
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      type: string
                    resourceVersion:
                      type: string
