{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secretvault-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretvault-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "secretvault-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingress.allowMetrics }}
    # Allow Prometheus / cluster monitoring to scrape metrics port
    - ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
  egress:
    # 1. Allow cluster DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow communication to SecretVault Control Plane Backend API
    - to:
        {{- if .Values.networkPolicy.egress.secretVaultApiCidr }}
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.secretVaultApiCidr }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.secretVaultApiPort }}
    # 3. Allow communication to Kubernetes API Server for controller-runtime reconciliation
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8443
{{- end }}
