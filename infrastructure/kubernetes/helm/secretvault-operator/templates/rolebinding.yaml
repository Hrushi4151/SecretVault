{{- if eq .Values.operator.scope "namespace" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "secretvault-operator.fullname" . }}-manager-rolebinding
  namespace: {{ default .Release.Namespace .Values.operator.watchNamespace }}
  labels:
    {{- include "secretvault-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "secretvault-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "secretvault-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
