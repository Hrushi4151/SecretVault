apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secretvault-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretvault-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: {{ if gt (int .Values.replicaCount) 1 }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "secretvault-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secretvault-operator.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "secretvault-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "secretvault-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --leader-election-id={{ .Values.leaderElection.leaseName }}
            - --leader-election-namespace={{ .Release.Namespace }}
            {{- if eq .Values.operator.scope "namespace" }}
            - --namespace={{ default .Release.Namespace .Values.operator.watchNamespace }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "secretvault-operator.fullname" . }}-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Ephemeral in-memory tmp filesystem required for readOnlyRootFilesystem
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.secretvault.tls.caBundle .Values.secretvault.tls.caSecretRef }}
            - name: custom-ca
              mountPath: /etc/ssl/certs/secretvault-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if .Values.secretvault.tls.caSecretRef }}
        - name: custom-ca
          secret:
            secretName: {{ .Values.secretvault.tls.caSecretRef }}
        {{- else if .Values.secretvault.tls.caBundle }}
        - name: custom-ca
          secret:
            secretName: {{ include "secretvault-operator.fullname" . }}-ca
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
